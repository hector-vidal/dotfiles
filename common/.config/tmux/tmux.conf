# Configuración de tmux. Mínima a propósito: solo lo que necesitan las
# herramientas del repositorio.

# Colores de 24 bits dentro de tmux (tema Dracula de bat, delta y fzf)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Enlaces OSC 8 (rutas y commits de delta) clicables dentro de tmux
set -as terminal-features ",*:hyperlinks"
